<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | WCC.BYFARIHA</title>
  
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="admin-body">
  <main class="login-wrap">
    <a class="brand" href="../index.html">
      <span class="brand-monogram">F</span>
      <span class="brand-text">
        <span class="brand-title">WCC.<b>BYFARIHA</b></span>
        <small class="brand-sub">OWNER DASHBOARD</small>
      </span>
    </a>

    <section class="login-card">
      <p class="section-eyebrow">PRIVATE ACCESS</p>
      <h1>Welcome back.</h1>
      <p>Masuk menggunakan akun pemilik untuk mengelola pricelist, portfolio, dan profil website.</p>
      
      <form id="loginForm" style="margin-top: 24px;">
        <label>Email Pemilik
          <input id="email" type="email" placeholder="owner@wccbyfariha.com" required autocomplete="username">
        </label>
        
        <label>Kata Sandi
          <input id="password" type="password" required autocomplete="current-password">
        </label>
        
        <button class="btn btn-terracotta full" type="submit" style="margin-top: 15px;">Masuk ke Dashboard</button>
        <p id="loginMessage" class="form-message"></p>
      </form>

      <a href="../index.html" class="back-link">← Kembali ke Website Utama</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
